<!DOCTYPE html>
<html>
<head>
  <script>
    // GitHub Pages SPA redirect — preserves path so React Router can handle it
    const base = '/badevil666';
    const path = window.location.pathname.replace(base, '') || '/';
    sessionStorage.setItem('redirect', path);
    window.location.replace(base + '/');
  </script>
</head>
</html>
