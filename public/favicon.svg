<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Pitch-black tile, rounded — same shape as iOS/Android app icons -->
  <rect width="64" height="64" rx="14" fill="#000000"/>

  <!-- 1px inner stroke on the tile for crisp edge at small sizes -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Simple white T, centered -->
  <g fill="#ffffff">
    <rect x="14" y="16" width="36" height="9" rx="2"/>
    <rect x="27.5" y="16" width="9" height="32" rx="2"/>
  </g>
</svg>
